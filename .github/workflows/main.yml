name: Build Code FA APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract versions
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          CSVERSION=$(grep '^code_server: ' pubspec.yaml | awk '{print $2}' | tr -d '\r')

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CSVERSION=$CSVERSION" >> "$GITHUB_ENV"

          echo "VERSION=$VERSION"
          echo "CSVERSION=$CSVERSION"

      - name: Download code-server
        shell: bash
        run: |
          mkdir -p assets

          wget -O "assets/code-server-${CSVERSION}-linux-arm64.tar.gz" \
            "https://github.com/coder/code-server/releases/download/v${CSVERSION}/code-server-${CSVERSION}-linux-arm64.tar.gz"

          ls -lh "assets/code-server-${CSVERSION}-linux-arm64.tar.gz"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Prepare dependency overrides
        shell: bash
        run: |
          rm -f pubspec_overrides.yaml

          printf '%s\n' \
            'dependency_overrides:' \
            '  permission_handler: ^11.3.1' \
            '  device_info_plus: ^10.1.2' \
            '  intl: 0.20.2' \
            '  signale:' \
            '    git:' \
            '      url: https://github.com/nightmare-space/signale' \
            '  xterm:' \
            '    git: https://github.com/TerminalStudio/xterm.dart' \
            '  global_repository:' \
            '    git: https://github.com/nightmare-space/global_repository' \
            '  behavior_api:' \
            '    git:' \
            '      url: https://github.com/nightmare-space/empty_package' \
            '      path: behavior_api' \
            > pubspec_overrides.yaml

          echo "===== pubspec_overrides.yaml ====="
          cat pubspec_overrides.yaml

      - name: Install Dependencies
        shell: bash
        run: |
          flutter pub get

      - name: Analyze important source
        shell: bash
        run: |
          echo "===== terminal_page.dart ====="
          sed -n '1,240p' lib/terminal_page.dart

          echo "===== terminal_controller.dart diagnostics ====="
          grep -n "Checking storage permission" lib/terminal_controller.dart || true
          grep -n "Creating runtime directories" lib/terminal_controller.dart || true
          grep -n "Initializing native environment" lib/terminal_controller.dart || true
          grep -n "STARTUP ERROR" lib/terminal_controller.dart || true

      - name: Prepare signing
        shell: bash
        run: |
          KEYSTORE_NAME="codefa-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jks"
          KEY_ALIAS="codefa${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"

          rm -f android/key.properties
          rm -f "android/app/${KEYSTORE_NAME}"

          keytool -genkeypair \
            -keystore "android/app/${KEYSTORE_NAME}" \
            -storepass android \
            -keypass android \
            -alias "${KEY_ALIAS}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CodeFA CI,O=CodeFA,C=US"

          printf '%s\n' \
            'storePassword=android' \
            'keyPassword=android' \
            "keyAlias=${KEY_ALIAS}" \
            "storeFile=${KEYSTORE_NAME}" \
            > android/key.properties

      - name: Show Android toolchain
        shell: bash
        run: |
          echo "===== Gradle ====="
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

          echo "===== AGP ====="
          grep "com.android.application" android/settings.gradle || true

          echo "===== Kotlin ====="
          grep "org.jetbrains.kotlin.android" android/settings.gradle || true

      - name: Build ARM64 APK
        shell: bash
        run: |
          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --dart-define=VERSION="${VERSION}" \
            --dart-define=CSVERSION="${CSVERSION}"

      - name: Locate APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find build/app/outputs -type f -name "*.apk" -print

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p output

          APK=$(find build/app/outputs -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK g

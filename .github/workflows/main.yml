name: Build Code FA APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract versions
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          CSVERSION=$(grep '^code_server: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CSVERSION=$CSVERSION" >> "$GITHUB_ENV"

          echo "Code FA version: $VERSION"
          echo "code-server version: $CSVERSION"

      - name: Download code-server ARM64
        run: |
          wget \
            -O "assets/code-server-${CSVERSION}-linux-arm64.tar.gz" \
            "https://github.com/coder/code-server/releases/download/v${CSVERSION}/code-server-${CSVERSION}-linux-arm64.tar.gz"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Prepare dependency overrides
        run: |
          rm -f pubspec.lock

          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            permission_handler: ^11.3.1
            device_info_plus: ^10.1.2
            intl: 0.20.2

            signale:
              git:
                url: https://github.com/nightmare-space/signale

            xterm:
              git: https://github.com/TerminalStudio/xterm.dart

            global_repository:
              git: https://github.com/nightmare-space/global_repository

            behavior_api:
              git:
                url: https://github.com/nightmare-space/empty_package
                path: behavior_api
          EOF

          echo "===== pubspec_overrides.yaml ====="
          cat pubspec_overrides.yaml

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub deps

      - name: Create temporary signing key
        run: |
          rm -f android/app/keystore.jks
          rm -f android/key.properties

          keytool -genkeypair \
            -v \
            -keystore android/app/keystore.jks \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > android/key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=keystore.jks
          EOF

      - name: Patch Gradle versions
        run: |
          sed -i \
            's#gradle-[0-9.]*-bin.zip#gradle-8.14-bin.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

          sed -i \
            "s/id 'com.android.application' version '[^']*'/id 'com.android.application' version '8.11.1'/" \
            android/settings.gradle

          sed -i \
            "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '2.2.20'/" \
            android/settings.gradle

          echo "===== gradle-wrapper.properties ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "===== settings.gradle ====="
          cat android/settings.gradle

      - name: Patch terminal_page.dart
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/terminal_page.dart")
          text = p.read_text()

          # Remove flutter_screenutil import if it was added previously.
          text = text.replace(
              "import 'package:flutter_screenutil/flutter_screenutil.dart';\n",
              ""
          )

          # Fix invalid color extension.
          text = text.replace(
              "Theme.of(context).colorScheme.primary.opacity02",
              "Theme.of(context).colorScheme.primary.withOpacityExact(0.2)"
          )

          p.write_text(text)
          PY

          echo "===== terminal_page.dart relevant lines ====="
          grep -n "opacity\\|withOpacity\\|screenutil" lib/terminal_page.dart || true

      - name: Patch pubspec.yaml
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          text = p.read_text()

          # Ensure intl version matches current global_repository.
          text = text.replace("intl: ^0.19.0", "intl: ^0.20.2")

          # Remove flutter_screenutil if it was manually added.
          lines = []
          for line in text.splitlines():
              if line.strip().startswith("flutter_screenutil:"):
                  continue
              lines.append(line)

          p.write_text("\n".join(lines) + "\n")
          PY

          echo "===== pubspec.yaml ====="

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Prepare dependency overrides
        run: |
          rm -f pubspec.lock

          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            permission_handler: ^11.3.1
            device_info_plus: ^10.1.2
            intl: 0.20.2
            xterm:
              git: https://github.com/TerminalStudio/xterm.dart
            global_repository:
              git: https://github.com/nightmare-space/global_repository
            behavior_api:
              git:
                url: https://github.com/nightmare-space/empty_package
                path: behavior_api
          EOF

          echo "===== pubspec_overrides.yaml ====="
          cat pubspec_overrides.yaml

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub deps

      - name: Create temporary signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/keystore.jks \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > android/key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=keystore.jks
          EOF

      - name: Build ARM64 APK
        run: |
          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --dart-define=VERSION=${VERSION} \
            --dart-define=CSVERSION=${CSVERSION}

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find build -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p output

          APK=$(find build/app/outputs -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "No APK generated"
            exit 1
          fi

          cp "$APK" "output/CodeFA_${VERSION}_Android_arm64_debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeFA-Android-arm64
          path: output/*.apk
          if-no-files-found: error

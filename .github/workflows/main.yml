name: Build Code FA APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract versions
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          CSVERSION=$(grep '^code_server: ' pubspec.yaml | awk '{print $2}' | tr -d '\r')

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CSVERSION=$CSVERSION" >> "$GITHUB_ENV"

          echo "VERSION=$VERSION"
          echo "CSVERSION=$CSVERSION"

      - name: Download code-server
        shell: bash
        run: |
          wget -O "assets/code-server-${CSVERSION}-linux-arm64.tar.gz" \
          "https://github.com/coder/code-server/releases/download/v${CSVERSION}/code-server-${CSVERSION}-linux-arm64.tar.gz"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Prepare dependencies
        shell: bash
        run: |
          rm -f pubspec.lock
          rm -f pubspec_overrides.yaml

          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            permission_handler: ^11.3.1
            device_info_plus: ^10.1.2
            intl: 0.20.2

            signale:
              git:
                url: https://github.com/nightmare-space/signale

            xterm:
              git: https://github.com/TerminalStudio/xterm.dart

            global_repository:
              git: https://github.com/nightmare-space/global_repository

            behavior_api:
              git:
                url: https://github.com/nightmare-space/empty_package
                path: behavior_api
          EOF

          flutter pub get

      - name: Patch terminal source
        shell: bash
        run: |
          sed -i "/flutter_screenutil/d" lib/terminal_page.dart

          perl -0pi -e 's/\b([0-9]+(?:\.[0-9]+)?)\.w\b/$1.0/g' \
            lib/terminal_page.dart

          perl -0pi -e 's/\bw\(([0-9]+(?:\.[0-9]+)?)\)/$1.0/g' \
            lib/terminal_page.dart

          sed -i \
            's/Theme\.of(context)\.colorScheme\.primary\.opacity02/Theme.of(context).colorScheme.primary.withOpacityExact(0.2)/g' \
            lib/terminal_page.dart

          echo "===== patched terminal_page.dart ====="
          sed -n '1,160p' lib/terminal_page.dart

      - name: Verify patched source
        shell: bash
        run: |
          if grep -qE '[0-9]+(\.[0-9]+)?\.w' lib/terminal_page.dart; then
            echo "ERROR: old .w syntax still exists"
            exit 1
          fi

          if grep -qE '\bw\([0-9]' lib/terminal_page.dart; then
            echo "ERROR: ViewMetric w() syntax still exists"
            exit 1
          fi

          if grep -q 'opacity02' lib/terminal_page.dart; then
            echo "ERROR: opacity02 still exists"
            exit 1
          fi

          if grep -q 'flutter_screenutil' lib/terminal_page.dart; then
            echo "ERROR: flutter_screenutil still exists"
            exit 1
          fi

          echo "Terminal source patch verified successfully."

      - name: Prepare signing
        shell: bash
        run: |
          KEYSTORE_NAME="codefa-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jks"
          KEY_ALIAS="codefa${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"

          rm -f android/key.properties
          rm -f "android/app/${KEYSTORE_NAME}"

          keytool -genkeypair \
            -keystore "android/app/${KEYSTORE_NAME}" \
            -storepass android \
            -keypass android \
            -alias "${KEY_ALIAS}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CodeFA CI,O=CodeFA,C=US"

          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=${KEY_ALIAS}
          storeFile=${KEYSTORE_NAME}
          EOF

          echo "===== key.properties ====="
          cat android/key.properties

          keytool -list \
            -keystore "android/app/${KEYSTORE_NAME}" \
            -storepass android \
            -alias "${KEY_ALIAS}"

      - name: Patch Gradle versions
        shell: bash
        run: |
          sed -i \
            's#gradle-[0-9.]*-bin.zip#gradle-8.14-bin.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

          sed -i \
            "s/id 'com.android.application' version '[^']*'/id 'com.android.application' version '8.11.1'/" \
            android/settings.gradle

          sed -i \
            "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version           java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Prepare dependencies
        shell: bash
        run: |
          rm -f pubspec.lock
          rm -f pubspec_overrides.yaml

          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            permission_handler: ^11.3.1
            device_info_plus: ^10.1.2
            intl: 0.20.2

            signale:
              git:
                url: https://github.com/nightmare-space/signale

            xterm:
              git: https://github.com/TerminalStudio/xterm.dart

            global_repository:
              git: https://github.com/nightmare-space/global_repository

            behavior_api:
              git:
                url: https://github.com/nightmare-space/empty_package
                path: behavior_api
          EOF

          flutter pub get

      - name: Patch terminal source
        shell: bash
        run: |
          sed -i "/flutter_screenutil/d" lib/terminal_page.dart

          perl -0pi -e 's/\b([0-9]+(?:\.[0-9]+)?)\.w\b/w($1)/g' \
            lib/terminal_page.dart

          sed -i \
            's/Theme\.of(context)\.colorScheme\.primary\.opacity02/Theme.of(context).colorScheme.primary.withOpacityExact(0.2)/g' \
            lib/terminal_page.dart

          echo "===== remaining .w references ====="
          grep -nE '[0-9]+(\.[0-9]+)?\.w' lib/terminal_page.dart || true

          echo "===== remaining opacity02 references ====="
          grep -n 'opacity02' lib/terminal_page.dart || true

          echo "===== patched source ====="
          sed -n '1,140p' lib/terminal_page.dart

      - name: Verify patched source
        shell: bash
        run: |
          if grep -qE '[0-9]+(\.[0-9]+)?\.w' lib/terminal_page.dart; then
            echo "ERROR: old .w syntax still exists"
            exit 1
          fi

          if grep -q 'opacity02' lib/terminal_page.dart; then
            echo "ERROR: opacity02 still exists"
            exit 1
          fi

          if grep -q 'flutter_screenutil' lib/terminal_page.dart; then
            echo "ERROR: flutter_screenutil import still exists"
            exit 1
          fi

      - name: Prepare signing
        shell: bash
        run: |
          KEYSTORE_NAME="codefa-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jks"
          KEY_ALIAS="codefa${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"

          rm -f android/key.properties
          rm -f "android/app/${KEYSTORE_NAME}"

          keytool -genkeypair \
            -keystore "android/app/${KEYSTORE_NAME}" \
            -storepass android \
            -keypass android \
            -alias "${KEY_ALIAS}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CodeFA CI,O=CodeFA,C=US"

          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=${KEY_ALIAS}
          storeFile=${KEYSTORE_NAME}
          EOF

          echo "===== key.properties ====="
          cat android/key.properties

          keytool -list \
            -keystore "android/app/${KEYSTORE_NAME}" \
            -storepass android \
            -alias "${KEY_ALIAS}"

      - name: Show Android toolchain
        shell: bash
        run: |
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          grep "com.android.application" android/settings.gradle
          grep "org.jetbrains.kotlin.android" android/settings.gradle

      - name: Build ARM64 APK
        shell: bash
        run: |
          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --dart-define=VERSION="${VERSION}" \
            --dart-define=CSVERSION="${CSVERSION}"

      - name: Locate APK
        shell: bash
        run: |
          find build/app/outputs -type f -name "*.apk" -print

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p output

          APK=$(find build/app/outputs -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "No APK generated."
            exit 1
          fi

          SAFE_VERSION=$(echo "$VERSION" | tr '+' '_')

          cp "$APK" \
            "output/CodeFA_${SAFE_VERSION}_Android_arm64_debug.apk"

          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeFA-Android-arm64
          path: output/*.apk
          if-no-files-found: error
